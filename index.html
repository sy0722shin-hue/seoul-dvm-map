<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>서울 시스템에어컨 영업 MAP v5</title><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"><style>
*{box-sizing:border-box}html,body,#map{height:100%;margin:0;font-family:Arial,'Malgun Gothic',sans-serif}#map{background:#e9edf1}.panel,.info{position:absolute;z-index:3;background:#fffffff2;border-radius:13px;box-shadow:0 4px 18px #2334}.panel{top:12px;left:12px;width:355px;max-width:calc(100vw - 24px);padding:14px}.info{right:12px;top:12px;width:355px;max-width:calc(100vw - 24px);padding:15px;max-height:80vh;overflow:auto}.panel h2{font-size:17px;color:#183763;margin:0 0 10px}.row{display:flex;gap:6px;margin:8px 0}.row input,.row select{flex:1;min-width:0;padding:10px;border:1px solid #ccd5e0;border-radius:8px;background:#fff}button{border:0;border-radius:8px;padding:10px;background:#2256a8;color:#fff;font-weight:bold;cursor:pointer}button:disabled{opacity:.55;cursor:wait}button.alt{background:#e3eaf3;color:#234067}.status{padding:10px;border-radius:8px;background:#eef3fa;font-size:12px;line-height:1.6;white-space:pre-wrap}.note,.info p{font-size:12px;line-height:1.65;color:#4b5d72}.info h3{margin:0 0 8px;font-size:18px;color:#183763}.info a{color:#1454ac}.marker{font-size:12px;font-weight:bold;background:#2166bb;color:white;padding:6px 10px;border:2px solid #fff;border-radius:20px;white-space:nowrap;box-shadow:0 2px 9px #0005;cursor:pointer;max-width:220px;overflow:hidden;text-overflow:ellipsis}.marker:hover,.marker.active{background:#e27a23;z-index:100}.badge{display:inline-block;background:#e7eefb;padding:4px 7px;border-radius:9px;margin:3px 2px;font-size:11px}.legend{font-size:11px;color:#65758b;margin:7px 0}.hideable{}@media(max-width:720px){.panel{width:calc(100vw - 24px);padding:11px}.panel h2{font-size:15px}.info{top:auto;bottom:15px;left:10px;right:10px;width:auto;max-height:38vh}.panel.compact{width:auto}.panel.compact .hideable{display:none}}
</style></head><body><div id="map"></div><section class="panel" id="panel"><h2>🏢 서울 시스템에어컨 영업 MAP <small>v5</small> <button class="alt" style="float:right;padding:5px" onclick="document.getElementById('panel').classList.toggle('compact')">접기/펼치기</button></h2><div class="hideable"><div class="row"><input id="search" placeholder="조회된 아파트 이름 검색" onkeydown="if(event.key==='Enter')searchName()"><button onclick="searchName()">검색</button></div><div class="row"><select id="district"><option value="">서울 전체</option></select><button class="alt" onclick="goDistrict()">지역 이동</button></div><div class="row"><button id="load" onclick="loadApartments()">현재 지도 아파트 조회</button><button class="alt" onclick="clearResults()">초기화</button></div><div class="status" id="status">지도 준비 중…</div><div class="legend">🔵 공개 지도에 이름이 등록된 아파트 · 🟠 선택한 아파트</div><div class="note">조회 버튼을 누르면 현재 화면 중심 기준 약 1.5km 반경을 조회합니다. 마우스를 이름 위에 올리거나 터치하면 우측(모바일: 하단)에서 정보를 확인합니다.</div><div class="note">※ 공개 OSM 데이터 기반. 모든 아파트 수록 아님. 실외기실·입주옵션·실제 구매문의는 확인되지 않으면 미확인. 매일 자동 갱신 기능은 아직 없습니다.</div></div></section><aside class="info" id="info"><h3>아파트 정보</h3><p>지역을 선택한 뒤 '현재 지도 아파트 조회'를 누르세요.</p></aside><script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script><script>
const centers={'강남구':[127.047,37.518],'강동구':[127.124,37.53],'강북구':[127.026,37.64],'강서구':[126.849,37.551],'관악구':[126.951,37.478],'광진구':[127.083,37.538],'구로구':[126.887,37.495],'금천구':[126.895,37.456],'노원구':[127.057,37.655],'도봉구':[127.047,37.668],'동대문구':[127.04,37.574],'동작구':[126.94,37.512],'마포구':[126.901,37.566],'서대문구':[126.936,37.579],'서초구':[127.032,37.483],'성동구':[127.036,37.563],'성북구':[127.017,37.589],'송파구':[127.106,37.514],'양천구':[126.866,37.517],'영등포구':[126.897,37.526],'용산구':[126.967,37.532],'은평구':[126.93,37.603],'종로구':[126.978,37.573],'중구':[126.998,37.564],'중랑구':[127.093,37.606]};const district=document.getElementById('district');Object.keys(centers).sort().forEach(k=>district.add(new Option(k,k)));const $=id=>document.getElementById(id);let map,markers=[],apartments=[],busy=false;const status=s=>$('status').textContent=s;function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function show(a){const p=a.tags||{},q=s=>encodeURIComponent(a.name+' '+s);$('info').innerHTML=`<h3>${esc(a.name)}</h3><span class="badge">공개 지도 등록정보</span><p><b>위치:</b> ${a.lat.toFixed(5)}, ${a.lon.toFixed(5)}</p><p><b>준공연도:</b> ${esc(p.start_date||'미확인')} / <b>세대수:</b> ${esc(p['building:flats']||'미확인')}</p><p><b>실외기실:</b> 미확인 / <b>입주 당시 옵션:</b> 미확인</p><p><b>설치이력·교체문의·구매희망:</b> 확인된 자료 없음</p><p><b>공개자료 검색(실제 문의 확인 아님)</b></p><p><a target="_blank" rel="noopener" href="https://www.google.com/search?q=${q('시스템에어컨 입주 옵션')}">입주 옵션 자료 ↗</a>　<a target="_blank" rel="noopener" href="https://www.google.com/search?q=${q('시스템에어컨 설치 교체 후기')}">설치·교체 후기 ↗</a></p><p><a target="_blank" rel="noopener" href="https://www.google.com/search?q=${q('삼성스토어 LG베스트샵 하이마트 공조업체 숨고 견적')}">유통경로·견적 공개검색 ↗</a></p><p class="note">공개 검색 결과는 실제 설치·구매·상담 실적을 뜻하지 않습니다.</p>`}
async function init(){if(!window.maplibregl){status('지도 라이브러리를 불러오지 못했습니다. 외부 CDN 접근을 확인하세요.');return}try{const r=await fetch('https://tiles.openfreemap.org/styles/positron');if(!r.ok)throw Error('지도 스타일 HTTP '+r.status);const style=await r.json();style.layers=(style.layers||[]).filter(l=>l.type!=='symbol');map=new maplibregl.Map({container:'map',style,center:[126.99,37.55],zoom:10.6});map.addControl(new maplibregl.NavigationControl(),'bottom-right');map.on('load',()=>status('지도 준비 완료. 구를 선택하고 조회 버튼을 누르세요.'));map.on('error',e=>console.warn('지도:',e.error))}catch(e){status('지도 배경 연결 실패: '+e.message)}}init();function goDistrict(){if(!map)return;const v=district.value;map.flyTo({center:v?centers[v]:[126.99,37.55],zoom:v?14:10.6});status((v||'서울 전체')+'로 이동 중입니다. 이동이 끝난 뒤 조회하세요.')}
function clearResults(s='조회 결과 초기화 완료'){markers.forEach(m=>m.remove());markers=[];apartments=[];status(s)}
function bboxFor(center){const lat=center.lat,lon=center.lng;const dy=.0135,dx=.017/Math.max(.65,Math.cos(lat*Math.PI/180)/.8);return [lat-dy,lon-dx,lat+dy,lon+dx].map(n=>n.toFixed(5)).join(',')}
async function requestOverpass(url,query){const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),18000);try{const r=await fetch(url+'?data='+encodeURIComponent(query),{signal:ctrl.signal});if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();if(!Array.isArray(j.elements))throw Error('응답 형식 오류');return j}finally{clearTimeout(timer)}}
async function loadApartments(){if(!map||busy)return;busy=true;$('load').disabled=true;clearResults('아파트 데이터 조회 중… 최대 약 40초 걸릴 수 있습니다.');const c=map.getCenter(),box=bboxFor(c);const query=`[out:json][timeout:15];(nwr["building"="apartments"]["name"](${box});nwr["residential"="apartments"]["name"](${box});nwr["landuse"="residential"]["name"](${box});nwr["place"="neighbourhood"]["name"](${box}););out center 450;`;let data=null,errors=[];for(const u of ['https://overpass.kumi.systems/api/interpreter','https://overpass.nchc.org.tw/api/interpreter','https://overpass-api.de/api/interpreter']){try{data=await requestOverpass(u,query);break}catch(e){errors.push(new URL(u).hostname+': '+e.message)}}if(!data){status('아파트 공개데이터 조회 실패. 지도 배경은 정상입니다.\n서버 장애 또는 회사망 차단 가능성이 있습니다.\n'+errors.join(' / '));busy=false;$('load').disabled=false;return}const seen=new Set();for(const x of data.elements){const p=x.tags||{},name=p['name:ko']||p.name;if(!name||!/(아파트|apt\b|래미안|자이|푸르지오|힐스테이트|롯데캐슬|아이파크|더샵|e편한|센트럴|위브|그라시움|포레나|리버파크|파크뷰)/i.test(name))continue;const lat=x.lat??x.center?.lat,lon=x.lon??x.center?.lon;if(!Number.isFinite(lat)||!Number.isFinite(lon))continue;const key=name+'|'+lat.toFixed(3)+'|'+lon.toFixed(3);if(seen.has(key))continue;seen.add(key);const a={name,lat,lon,tags:p};apartments.push(a);const el=document.createElement('div');el.className='marker';el.title=name;el.textContent=name;el.addEventListener('mouseenter',()=>show(a));el.addEventListener('click',()=>{document.querySelectorAll('.marker.active').forEach(x=>x.classList.remove('active'));el.classList.add('active');show(a)});markers.push(new maplibregl.Marker({element:el,anchor:'center'}).setLngLat([lon,lat]).addTo(map))}status(apartments.length?`${apartments.length}개 아파트 이름을 표시했습니다. 마우스를 올리거나 터치하세요.\n(공개 OSM 등록 단지 기준, 전체 아파트 아님)`:'조회 서버 연결 성공, 이 위치에서 이름이 등록된 아파트를 찾지 못했습니다.\n지도 중심을 다른 단지 쪽으로 이동해 다시 조회하세요.');busy=false;$('load').disabled=false}
function searchName(){const s=$('search').value.trim().toLowerCase();if(!s)return;const a=apartments.find(a=>a.name.toLowerCase().includes(s));if(a){map.flyTo({center:[a.lon,a.lat],zoom:16});show(a)}else status('현재 조회한 범위에 해당 이름이 없습니다. 원하는 지역으로 이동하여 먼저 아파트를 조회하세요.')}
</script></body></html>
