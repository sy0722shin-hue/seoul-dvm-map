<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>서울 시스템에어컨 영업 MAP v4</title><link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet"><style>
*{box-sizing:border-box}html,body,#map{height:100%;margin:0;font-family:Arial,'Malgun Gothic',sans-serif}#map{background:#edf1f4}.panel{position:absolute;z-index:3;top:12px;left:12px;width:355px;max-width:calc(100vw - 24px);padding:15px;background:#fffffff5;border-radius:14px;box-shadow:0 5px 22px #2333}.panel h2{font-size:18px;margin:0 0 8px;color:#19315a}.row{display:flex;gap:6px;margin:9px 0}.row input,.row select{flex:1;min-width:0;padding:10px;border:1px solid #cbd5e1;border-radius:8px;background:white}button{cursor:pointer;background:#2457aa;color:white;border:0;border-radius:8px;padding:10px;font-weight:bold}button.alt{background:#e4eaf3;color:#19315a}.note{font-size:12px;color:#5e6d7e;line-height:1.6}.status{padding:9px;background:#eef3f9;border-radius:8px;font-size:12px}.info{position:absolute;z-index:3;right:12px;top:12px;width:350px;max-width:calc(100vw - 24px);background:#fff;border-radius:14px;padding:16px;box-shadow:0 5px 22px #2333;max-height:75vh;overflow:auto}.info h3{margin:0 0 10px}.info p{font-size:13px;line-height:1.5;margin:7px 0}.info a{font-size:12px;color:#1c56a6}.badge{display:inline-block;border-radius:12px;background:#e9eef8;padding:4px 8px;font-size:11px;margin:3px}.marker{background:#3674c8;color:white;border:2px solid white;border-radius:15px;padding:5px 9px;white-space:nowrap;font-size:11px;box-shadow:0 2px 7px #0004;cursor:pointer}.marker:hover{background:#e67629;z-index:99}.footer{font-size:11px;color:#6b7789;margin-top:10px}@media(max-width:700px){.panel{width:calc(100vw - 24px);padding:11px}.panel h2{font-size:15px}.info{top:auto;bottom:20px;right:10px;left:10px;width:auto;max-height:38vh}.panel.compact .hideable{display:none}.panel.compact{width:auto;max-width:calc(100vw - 24px)}}
</style></head><body><div id="map"></div><div class="panel" id="panel"><h2>🏢 서울 시스템에어컨 영업 MAP <small>v4</small> <button class="alt" onclick="document.getElementById('panel').classList.toggle('compact')" style="float:right;padding:5px">접기</button></h2><div class="hideable"><div class="row"><input id="search" placeholder="단지명 검색 (조회된 단지 대상)"><button onclick="searchName()">검색</button></div><div class="row"><select id="district"><option value="">서울 전체</option></select><button class="alt" onclick="goDistrict()">지역 이동</button></div><div class="row"><button onclick="loadApartments()">현재 지도 아파트 조회</button><button class="alt" onclick="clearResults()">초기화</button></div><div class="status" id="status">지도를 확대(동 단위)한 뒤 '현재 지도 아파트 조회'를 누르세요.</div><div class="note" style="margin-top:8px">🔵 아파트 이름에 마우스를 올리거나 클릭하면 우측 정보창이 열립니다. 회색 지도에서 상호명·도로명 표기를 숨겼습니다.</div><div class="footer">공개 OSM 기반 · 설치이력/옵션/구매의향은 공개자료만으로 확인 불가 · 자동 일일 갱신 미구현</div></div></div><div class="info" id="info"><h3>아파트 정보</h3><p>조회 후 아파트 이름 위에 마우스를 올려주세요.</p><p class="note">준공연도·세대수·실외기실 여부는 자료가 없으면 미확인으로 표시합니다.</p></div><script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script><script>
const centers={'강남구':[127.047,37.518],'강동구':[127.124,37.53],'강북구':[127.026,37.64],'강서구':[126.849,37.551],'관악구':[126.951,37.478],'광진구':[127.083,37.538],'구로구':[126.887,37.495],'금천구':[126.895,37.456],'노원구':[127.057,37.655],'도봉구':[127.047,37.668],'동대문구':[127.04,37.574],'동작구':[126.94,37.512],'마포구':[126.901,37.566],'서대문구':[126.936,37.579],'서초구':[127.032,37.483],'성동구':[127.036,37.563],'성북구':[127.017,37.589],'송파구':[127.106,37.514],'양천구':[126.866,37.517],'영등포구':[126.897,37.526],'용산구':[126.967,37.532],'은평구':[126.93,37.603],'종로구':[126.978,37.573],'중구':[126.998,37.564],'중랑구':[127.093,37.606]};const district=document.getElementById('district');Object.keys(centers).sort().forEach(k=>district.add(new Option(k,k)));
let map,markers=[],apartments=[];const status=t=>document.getElementById('status').textContent=t;
function show(a){const p=a.tags||{};const name=esc(a.name);const q=encodeURIComponent(a.name+' 시스템에어컨');document.getElementById('info').innerHTML=`<h3>${name}</h3><span class="badge">${esc(p.building||'아파트 / 공동주택 추정')}</span><p><b>위치:</b> ${a.lat.toFixed(5)}, ${a.lon.toFixed(5)}</p><p><b>준공:</b> ${esc(p.start_date||'미확인')}　<b>세대수:</b> ${esc(p['building:flats']||'미확인')}</p><p><b>입주시 시스템에어컨 옵션:</b> 미확인</p><p><b>실외기실:</b> 미확인</p><p><b>설치이력·교체문의·구매의향:</b> 확인된 자료 없음</p><p><b>관련 공개자료 찾아보기</b></p><p><a target="_blank" rel="noopener" href="https://www.google.com/search?q=${q}">설치·교체 후기 검색 ↗</a>　<a target="_blank" rel="noopener" href="https://www.google.com/search?q=${encodeURIComponent(a.name+' 시스템에어컨 입주 옵션')}">입주 옵션 검색 ↗</a></p><p><a target="_blank" rel="noopener" href="https://www.google.com/search?q=${encodeURIComponent(a.name+' 시스템에어컨 삼성스토어 LG베스트샵 하이마트 숨고 공조 견적')}">유통경로·견적 공개자료 검색 ↗</a></p><p class="note">검색 링크는 실제 문의나 견적 발생을 의미하지 않습니다.</p>`}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function init(){try{const r=await fetch('https://tiles.openfreemap.org/styles/positron');if(!r.ok)throw Error('스타일 불러오기 실패');const style=await r.json();style.layers=style.layers.filter(l=>l.type!=='symbol');map=new maplibregl.Map({container:'map',style,center:[126.99,37.55],zoom:10.6,attributionControl:true});map.addControl(new maplibregl.NavigationControl(),'bottom-right');map.on('error',e=>{console.warn(e.error)});map.on('load',()=>status('지도 준비 완료. 구를 선택하고 지도를 확대해 단지를 조회하세요.'));}catch(e){status('지도 배경 연결 실패: '+e.message+' (외부 지도 서버 접근 여부 확인)')}}init();
function goDistrict(){const v=district.value;if(v&&map){map.flyTo({center:centers[v],zoom:13.4});status(v+'로 이동했습니다. 지도 확대 후 조회하세요.')}else if(map)map.flyTo({center:[126.99,37.55],zoom:10.6})}
function clearResults(){markers.forEach(m=>m.remove());markers=[];apartments=[];status('조회 결과 초기화 완료')}
async function loadApartments(){if(!map)return;const b=map.getBounds(),span=Math.max(b.getNorth()-b.getSouth(),b.getEast()-b.getWest());if(span>0.075){status('조회 범위가 너무 넓습니다. 지도 확대(동 단위) 후 다시 눌러주세요.');return}clearResults();status('공개 지도에서 아파트 정보를 조회 중입니다…');const box=[b.getSouth(),b.getWest(),b.getNorth(),b.getEast()].map(n=>n.toFixed(5)).join(',');const query=`[out:json][timeout:25];(nwr["building"="apartments"](${box});nwr["landuse"="residential"]["name"](${box});nwr["residential"="apartments"](${box}););out center 350;`;const urls=['https://overpass.kumi.systems/api/interpreter','https://overpass-api.de/api/interpreter'];let data=null;for(const url of urls){try{const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),28000);const r=await fetch(url,{method:'POST',body:'data='+encodeURIComponent(query),headers:{'Content-Type':'application/x-www-form-urlencoded'},signal:ctrl.signal});clearTimeout(timer);if(!r.ok)throw Error('HTTP '+r.status);data=await r.json();break}catch(e){console.warn('조회 서버:',e)}}if(!data){status('아파트 데이터 서버에 연결하지 못했습니다. 잠시 후 다시 조회하세요.');return}const seen=new Set();for(const x of data.elements||[]){const p=x.tags||{},name=p.name||p['name:ko'];if(!name||!/(아파트|APT|래미안|자이|푸르지오|힐스테이트|롯데캐슬|아이파크|더샵|e편한|센트럴|위브|그라시움|포레나)/i.test(name))continue;const lat=x.lat??x.center?.lat,lon=x.lon??x.center?.lon;if(!lat||!lon||seen.has(name))continue;seen.add(name);const a={name,lat,lon,tags:p};apartments.push(a);const el=document.createElement('div');el.className='marker';el.textContent=name;el.addEventListener('mouseenter',()=>show(a));el.addEventListener('click',()=>show(a));markers.push(new maplibregl.Marker({element:el,anchor:'center'}).setLngLat([lon,lat]).addTo(map))}status(`${apartments.length}개 아파트 이름 표시 (공개 OSM 등록정보 기준, 전체 단지 아님)`)}
function searchName(){const s=document.getElementById('search').value.trim().toLowerCase();if(!s)return;const a=apartments.find(a=>a.name.toLowerCase().includes(s));if(a){map.flyTo({center:[a.lon,a.lat],zoom:16});show(a)}else status('현재 조회된 단지에 없습니다. 해당 지역으로 이동해 조회한 뒤 검색하세요.')}
</script></body></html>
