<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>서울 시스템에어컨 영업 MAP</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,'Malgun Gothic',sans-serif;color:#18243a}#map{position:absolute;inset:0;z-index:1}.top{position:absolute;z-index:900;top:14px;left:14px;right:14px;display:flex;gap:8px;align-items:flex-start;pointer-events:none}.panel{pointer-events:auto;background:#fff;box-shadow:0 5px 22px #13233b35;border-radius:14px;padding:14px;width:min(390px,calc(100vw - 28px));max-height:calc(100vh - 30px);overflow:auto}.brand{font-weight:800;font-size:18px;color:#102858}.sub{font-size:12px;color:#687589;margin:4px 0 12px}.row{display:flex;gap:6px;margin:8px 0}.row input,.row select{border:1px solid #ccd5e2;border-radius:8px;padding:10px;font-size:14px;min-width:0;flex:1}.btn{background:#1548b7;border:0;border-radius:8px;padding:10px;color:#fff;font-weight:700;cursor:pointer}.btn.secondary{background:#edf3ff;color:#173b84}.muted{font-size:12px;color:#687589;line-height:1.5}.status{font-size:12px;background:#f1f5fc;border-radius:8px;padding:9px;margin:9px 0}.legend{display:flex;flex-wrap:wrap;gap:7px;font-size:12px;margin:8px 0}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}.detail{display:none;border-top:1px solid #e0e5ed;padding-top:10px;margin-top:12px;font-size:13px;line-height:1.7}.detail h3{margin:0 0 6px;font-size:17px}.leaflet-tooltip{font-size:13px;line-height:1.6}.footer{position:absolute;z-index:800;bottom:18px;right:12px;background:#fffef2dd;border-radius:8px;padding:7px;font-size:11px;max-width:240px}.minimize{float:right;border:0;background:#eaf0fc;border-radius:7px;padding:5px 8px;cursor:pointer}.panel.collapsed{width:auto}.panel.collapsed .content{display:none}@media(max-width:600px){.top{top:8px;left:8px;right:8px}.panel{padding:11px;width:min(360px,calc(100vw - 16px));max-height:53vh}.brand{font-size:16px}.footer{max-width:185px;font-size:10px;bottom:22px}}</style></head><body><div id="map"></div><div class="top"><div class="panel" id="panel"><button class="minimize" onclick="document.getElementById('panel').classList.toggle('collapsed')">☰ 접기/펼치기</button><div class="brand">🏢 서울 시스템에어컨 영업 MAP</div><div class="content"><div class="sub">지도 우선형 · 공개 지도 데이터 시범 조회</div><div class="row"><input id="q" placeholder="아파트명·동네 검색 (예: 잠실, 래미안)" aria-label="검색어"><button class="btn" id="search">검색</button></div><div class="row"><select id="district"><option value="">서울 전체</option></select><button class="btn secondary" id="load">현재 지도 단지 조회</button></div><div class="legend"><span><i class="dot" style="background:#1463dd"></i>일반 아파트</span><span><i class="dot" style="background:#9b43b5"></i>주상복합 추정</span><span><i class="dot" style="background:#d98c12"></i>준공연도 미확인</span></div><div class="status" id="status">지도가 먼저 표시됩니다. 구를 선택하거나 지도를 확대하고 ‘현재 지도 단지 조회’를 누르세요.</div><div class="muted">PC: 마커에 마우스를 올리면 요약, 클릭하면 상세정보. 휴대폰: 마커 터치. 실외기실·설치이력·교체문의는 확인된 데이터가 없어 ‘미확인’으로 표시합니다.</div><div class="detail" id="detail"></div></div></div></div><div class="footer">지도 © OpenStreetMap 기여자 · 단지정보 © OpenStreetMap 기여자 · 실제 영업정보 아님</div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const map=L.map('map',{zoomControl:false}).setView([37.5665,126.9780],11);L.control.zoom({position:'bottomleft'}).addTo(map);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);const group=L.layerGroup().addTo(map);const status=document.getElementById('status'),detail=document.getElementById('detail');let items=[];const districts=['강남구','강동구','강북구','강서구','관악구','광진구','구로구','금천구','노원구','도봉구','동대문구','동작구','마포구','서대문구','서초구','성동구','성북구','송파구','양천구','영등포구','용산구','은평구','종로구','중구','중랑구'];const sel=document.getElementById('district');districts.forEach(d=>sel.add(new Option(d,d)));function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function info(p){let t=p.tags||{},name=t.name||t['name:ko']||'이름 미등록 단지';let year=(t.start_date||t['building:year']||'').match(/(?:19|20)\d{2}/)?.[0];let mixed=t.building==='apartments'&&(/주상복합/.test(name)||t['building:use']==='mixed');return {name,year:year||'미확인',mixed,units:t['building:flats']||t.flats||'미확인',address:[t['addr:city'],t['addr:street'],t['addr:housenumber']].filter(Boolean).join(' ')||'지도 위치 참조',id:p.id}}function show(p){let d=info(p);detail.style.display='block';detail.innerHTML=`<h3>${esc(d.name)}</h3><div>건물 분류: ${d.mixed?'주상복합 추정':'아파트 (지도 등록 분류)'}</div><div>준공연도: ${esc(d.year)}</div><div>세대수: ${esc(d.units)}</div><div>주소: ${esc(d.address)}</div><div>실외기실: <b>미확인</b></div><div>시스템에어컨 설치이력: <b>자료 없음</b></div><div>교체문의: <b>자료 없음</b></div><div>영업기회 점수: <b>산정 보류(검증 데이터 부족)</b></div><div class="muted">출처: OpenStreetMap 공개 등록 정보 · 객체번호 ${esc(d.id)}. 주상복합 구분은 명칭 등으로 추정되며 확정 자료가 아닙니다.</div>`;if(window.innerWidth<650)document.getElementById('panel').classList.remove('collapsed')}
function render(data){items=data;group.clearLayers();let count=0;data.forEach(p=>{let d=info(p);if(!p.lat||!p.lon)return;let year=Number(d.year);if(d.year!=='미확인'&&year<(d.mixed?2000:2005))return;let color=d.year==='미확인'?'#d98c12':d.mixed?'#9b43b5':'#1463dd';let marker=L.circleMarker([p.lat,p.lon],{radius:7,color:'#fff',weight:1.5,fillColor:color,fillOpacity:.9}).addTo(group);marker.bindTooltip(`<b>${esc(d.name)}</b><br>준공: ${esc(d.year)} · 세대수: ${esc(d.units)}<br>실외기실: 미확인`,{direction:'top',sticky:true});marker.on('click',()=>show(p));count++});status.textContent=`현재 지도에서 ${count}개 마커 표시 (조회 ${data.length}개 중 연도 조건 적용). 미등록 단지는 검색되지 않을 수 있습니다.`}
async function load(){let b=map.getBounds();if(map.getZoom()<13){status.textContent='서버 부담과 조회 정확도를 위해 지도를 13단계 이상 확대해 주세요. 구를 선택하면 해당 구 중심으로 확대됩니다.';return}status.textContent='OpenStreetMap 공개 데이터 조회 중… (외부 서버 상태에 따라 실패할 수 있습니다)';let box=[b.getSouth(),b.getWest(),b.getNorth(),b.getEast()].map(n=>n.toFixed(5)).join(',');let query=`[out:json][timeout:22];(way["building"="apartments"](${box});relation["building"="apartments"](${box});way["landuse"="residential"]["name"](${box}););out center 400;`;let urls=['https://overpass.kumi.systems/api/interpreter','https://overpass-api.de/api/interpreter'];for(let u of urls){try{let controller=new AbortController(),timer=setTimeout(()=>controller.abort(),28000);let r=await fetch(u,{method:'POST',body:new URLSearchParams({data:query}),signal:controller.signal});clearTimeout(timer);if(!r.ok)throw Error('HTTP '+r.status);let j=await r.json();render((j.elements||[]).map(e=>({...e,lat:e.lat??e.center?.lat,lon:e.lon??e.center?.lon})));return}catch(e){status.textContent='첫 데이터 서버 응답 실패, 다른 서버 시도 중…'}}status.textContent='공개 데이터 서버 조회 실패. 잠시 후 재시도해 주세요. 지도 자체는 계속 이용할 수 있습니다.'}
document.getElementById('load').onclick=load;sel.onchange=async()=>{if(!sel.value){map.setView([37.5665,126.978],11);group.clearLayers();return}status.textContent=sel.value+' 위치 검색 중…';try{let r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=kr&q='+encodeURIComponent('서울특별시 '+sel.value));let j=await r.json();if(j[0]){map.setView([+j[0].lat,+j[0].lon],14);status.textContent='구 중심으로 이동했습니다. 「현재 지도 단지 조회」를 누르세요.'}else status.textContent='구 위치 검색 결과가 없습니다.'}catch(e){status.textContent='위치 검색 서버에 연결할 수 없습니다.'}};document.getElementById('search').onclick=async()=>{let q=document.getElementById('q').value.trim();if(!q)return;let found=items.filter(p=>info(p).name.includes(q));if(found.length){let p=found[0];map.setView([p.lat,p.lon],16);show(p);return}status.textContent='공개 지도에서 장소 검색 중…';try{let r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=5&countrycodes=kr&q='+encodeURIComponent('서울 '+q));let j=await r.json();if(j.length){map.setView([+j[0].lat,+j[0].lon],16);status.textContent='검색 위치로 이동했습니다. 「현재 지도 단지 조회」를 눌러 마커를 불러오세요.'}else status.textContent='검색 결과가 없습니다. 다른 명칭으로 시도하세요.'}catch(e){status.textContent='장소 검색 서버 연결 실패'}};document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('search').click()});
</script></body></html>
