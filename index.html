<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>서울 시스템에어컨 영업 MAP v6</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,'Malgun Gothic',sans-serif;color:#1b273b}#map{position:fixed;inset:0;background:#e8edf0}.panel{position:absolute;z-index:800;top:15px;left:15px;width:350px;max-width:calc(100vw - 30px);background:#fffffff2;border-radius:14px;padding:16px;box-shadow:0 4px 18px #0002}.panel h2{font-size:18px;margin:0 0 10px}.panel input,.panel select,.panel button{padding:10px;border:1px solid #c8ced8;border-radius:7px;font-size:14px}.panel input{width:100%;margin-bottom:7px}.row{display:flex;gap:7px;margin-bottom:8px}.row select{flex:1;min-width:0}.panel button{background:#214e9c;color:white;cursor:pointer}.panel small{display:block;line-height:1.5;color:#566275}.info{position:absolute;z-index:801;right:15px;top:15px;width:325px;max-width:calc(100vw - 30px);max-height:80vh;overflow:auto;background:#fffefaed;padding:15px;border-radius:12px;box-shadow:0 4px 18px #0002}.info h3{margin:0 0 10px}.info p{margin:6px 0;font-size:13px}.badge{display:inline-block;padding:3px 6px;background:#f1e9c9;border-radius:4px;font-size:11px}.apt-label{background:#1458a5e6;color:white;border:1px solid white;border-radius:5px;padding:3px 6px;font-weight:700;white-space:nowrap;box-shadow:0 1px 5px #0005}.leaflet-tooltip.apt-tooltip{background:#1458a5e6;color:white;border:1px solid white;border-radius:5px;font-weight:700;box-shadow:none}.leaflet-tooltip-top.apt-tooltip:before{border-top-color:#1458a5e6}@media(max-width:700px){.panel{top:8px;left:8px;width:calc(100vw - 16px);padding:10px}.panel h2{font-size:15px}.info{top:auto;bottom:15px;right:8px;width:calc(100vw - 16px);max-height:36vh}.panel small{font-size:11px}} </style></head><body><div id="map"></div><section class="panel"><h2>🏢 서울 시스템에어컨 영업 MAP <span class="badge">v6</span></h2><input id="search" placeholder="아파트명 검색 (예: 고덕그라시움)"><div class="row"><select id="district"><option value="">서울 25개 구 전체</option></select><button id="go">검색/이동</button><button id="reset">초기화</button></div><small id="status">공개 지도에서 아파트 위치를 조회합니다.</small><small>파란 표식: 조회된 아파트 · 마우스 올림/터치: 우측 정보 · 미확인 자료는 추정하지 않습니다.</small></section><aside class="info" id="info"><h3>아파트 정보</h3><p>아파트 표식에 마우스를 올리거나 터치하세요.</p><p>단지별 입주 옵션·설치 이력·문의는 검증된 공개 자료가 없으면 '미확인'입니다.</p></aside><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const districts={'강남구':[37.5172,127.0473],'강동구':[37.5301,127.1238],'강북구':[37.6396,127.0257],'강서구':[37.5509,126.8495],'관악구':[37.4784,126.9516],'광진구':[37.5385,127.0823],'구로구':[37.4954,126.8874],'금천구':[37.4569,126.8955],'노원구':[37.6542,127.0568],'도봉구':[37.6688,127.0471],'동대문구':[37.5744,127.0396],'동작구':[37.5124,126.9393],'마포구':[37.5663,126.9014],'서대문구':[37.5791,126.9368],'서초구':[37.4837,127.0324],'성동구':[37.5633,127.0369],'성북구':[37.5894,127.0167],'송파구':[37.5145,127.1059],'양천구':[37.5170,126.8666],'영등포구':[37.5264,126.8962],'용산구':[37.5326,126.9905],'은평구':[37.6027,126.9291],'종로구':[37.5735,126.9790],'중구':[37.5641,126.9979],'중랑구':[37.6063,127.0926]};
const map=L.map('map',{zoomControl:false}).setView([37.55,126.99],11);L.control.zoom({position:'bottomleft'}).addTo(map);L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors &copy; CARTO'}).addTo(map);
const sel=document.getElementById('district');Object.keys(districts).sort((a,b)=>a.localeCompare(b,'ko')).forEach(d=>{const o=document.createElement('option');o.value=d;o.textContent=d;sel.appendChild(o)});const layer=L.layerGroup().addTo(map);let all=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const info=document.getElementById('info'),status=document.getElementById('status');function show(a){info.innerHTML='<h3>'+esc(a.name)+'</h3><p><b>주소/지역:</b> '+esc(a.address||'좌표 기반 조회')+'</p><p><b>건물 유형:</b> '+esc(a.type||'공개 지도 아파트')+'</p><p><b>준공연도·세대수:</b> 미확인</p><p><b>실외기실 유무:</b> 미확인 (현장 확인 필요)</p><p><b>입주 시스템에어컨 옵션:</b> 미확인</p><p><b>설치·교체 이력:</b> 미확인</p><p><b>최근 구매 문의:</b> 미확인</p><p><b>삼성스토어·LG베스트샵·하이마트·개인공조·인테리어 업체:</b> 단지별 거래·견적 확인 자료 없음</p><small>출처: OpenStreetMap 공개 지리 데이터. 실제 상담/견적 내역과 연결되지 않습니다.</small>'}
function draw(list){layer.clearLayers();list.forEach(a=>{const marker=L.circleMarker([a.lat,a.lon],{radius:8,color:'#fff',weight:2,fillColor:'#165bb3',fillOpacity:.85}).addTo(layer);marker.bindTooltip(a.name,{direction:'top',className:'apt-tooltip'});marker.on('mouseover',()=>show(a));marker.on('click',()=>show(a));});status.textContent='현재 표시: '+list.length+'개 단지 (공개 지도 등록 기준, 전체 아파트 목록 아님)';}
// 공개 지도 서버는 부하/접근제한이 있어 여러 서버 순차 시도. 성공 데이터는 브라우저에 캐시.
const endpoints=['https://overpass.kumi.systems/api/interpreter','https://overpass.nchc.org.tw/api/interpreter','https://overpass.private.coffee/api/interpreter'];let seq=0;async function load(){const token=++seq;const b=map.getBounds(),s=b.getSouth().toFixed(5),w=b.getWest().toFixed(5),n=b.getNorth().toFixed(5),e=b.getEast().toFixed(5);const area=(n-s)*(e-w);if(map.getZoom()<13||area>0.018){status.textContent='아파트 조회는 지도 확대(13단계 이상) 후 가능합니다. 25개 구 선택은 이동 기능입니다.';return;}const query='[out:json][timeout:25];(way["building"="apartments"]('+s+','+w+','+n+','+e+');relation["building"="apartments"]('+s+','+w+','+n+','+e+');way["landuse"="residential"]["name"]('+s+','+w+','+n+','+e+'););out center 250;';status.textContent='공개 지도에서 단지 검색 중…';for(const endpoint of endpoints){try{const ctrl=new AbortController();const t=setTimeout(()=>ctrl.abort(),16000);let res;try{res=await fetch(endpoint,{method:'POST',body:new URLSearchParams({data:query}),signal:ctrl.signal})}finally{clearTimeout(t)}if(!res.ok)throw Error('HTTP '+res.status);const json=await res.json();if(token!==seq)return;all=(json.elements||[]).filter(x=>x.center?.lat&&x.center?.lon).map(x=>({lat:x.center.lat,lon:x.center.lon,name:x.tags?.name||'이름 미등록 아파트',type:x.tags?.building==='apartments'?'아파트':'주거 단지',address:[x.tags?.['addr:city'],x.tags?.['addr:street'],x.tags?.['addr:housenumber']].filter(Boolean).join(' ')}));draw(all);return;}catch(err){if(token!==seq)return;status.textContent='조회 서버 연결 재시도 중…';}}status.textContent='외부 아파트 조회 서버 연결 실패. 잠시 후 재조회하거나 다른 네트워크에서 시도하세요. 지도 자체는 정상 이용 가능합니다.';}
document.getElementById('go').onclick=()=>{const q=document.getElementById('search').value.trim(),d=sel.value;if(q&&all.length){const found=all.filter(a=>a.name.includes(q));if(found.length){draw(found);map.setView([found[0].lat,found[0].lon],16);show(found[0]);return;}}if(d){map.setView(districts[d],14);setTimeout(load,450)}else if(q){status.textContent='아파트 이름 검색은 현재 조회된 단지에서만 가능합니다. 해당 구로 이동 후 조회하세요.';}else load();};document.getElementById('reset').onclick=()=>{document.getElementById('search').value='';sel.value='';layer.clearLayers();map.setView([37.55,126.99],11);status.textContent='구를 선택하고 지도를 확대하여 아파트를 조회하세요.'};let timer;map.on('moveend',()=>{clearTimeout(timer);timer=setTimeout(()=>{if(map.getZoom()>=13)load()},700)});</script></body></html>
